---
global:
  scrape_interval: 15s
  evaluation_interval: 15s
  scrape_timeout: 10s
  external_labels:
    monitor: 'Alertmanager'

rule_files:
  - 'alert.rules'

scrape_configs:

  - job_name: 'speedtest'
    metrics_path: /metrics
    scrape_interval: 60m
    scrape_timeout: 60s
    static_configs:
      - targets: ['speedtest:9798']

  - job_name: 'ping'
    metrics_path: /probe
    scrape_interval: 5s
    params:
      module: [http_2xx]
    file_sd_configs:
      - files:
          - pinghosts.yaml
    relabel_configs:
      - source_labels: [__address__]
        regex: '(.*);(.*)'
        target_label: instance
        replacement: 
      - source_labels: [__address__]
        regex: '(.*);(.*)'
        target_label: humanname
        replacement: 
      - source_labels: [instance]
        target_label: __param_target
      - target_label: __address__
        replacement: ping:9115

  - job_name: 'node'
    static_configs:
      - targets: ['100.88.180.107:9100', '100.74.229.93:9100', '100.119.216.36:9100']
        labels:
          cluster: 'pi-cluster'

  - job_name: 'pihole'
    static_configs:
      - targets: ['pihole-exporter:9617']
